
name: Build Watch Face

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract watch face project
        run: unzip -o Red_Silver_Watch_Face_Source.zip -d source

      - name: Build watch face APK
        working-directory: source/Red_Silver_Watch_Face
        run: gradle assembleDebug --no-daemon

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Red-Silver-Watch-Face-APK
          path: source/Red_Silver_Watch_Face/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
